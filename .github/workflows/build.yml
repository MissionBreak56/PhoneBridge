name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da release (ex.: v1.0.0); vazio = só compilar"
        required: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build PC server exe
        working-directory: pc
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --noconsole --name PhoneBridgeServer server.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-pc-exe
          path: pc/dist/PhoneBridgeServer.exe

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [android, pc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/PhoneBridge-android-apk/*.apk PhoneBridge-android.apk
          mv dist/PhoneBridge-pc-exe/PhoneBridgeServer.exe PhoneBridgeServer.exe
          gh release create "${{ inputs.version }}" --target "${{ github.sha }}" PhoneBridge-android.apk PhoneBridgeServer.exe \
            --repo "${{ github.repository }}" --title "PhoneBridge ${{ inputs.version }}" --notes-file - <<'NOTES'
          Use o celular Android como microfone ou alto-falante do PC pelo Wi-Fi.

          - PhoneBridge-android.apk: instale no celular (APK de depuração; permita fontes desconhecidas).
          - PhoneBridgeServer.exe: servidor para Windows. Para o modo microfone, instale o VB-Cable (https://vb-audio.com/Cable/).

          Sem criptografia nem senha: use só em rede confiável.
          NOTES
